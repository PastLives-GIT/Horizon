<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Daily — AI-Curated News Digest</title>
<meta name="description" content="Horizon is an AI-driven news aggregation system. Daily briefings in English & Chinese from Hacker News, Reddit, RSS, GitHub, and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F305;</text></svg>">
<link rel="stylesheet" href="assets/css/horizon.css">
<script defer src="assets/js/horizon.js"></script>
</head>
<body>

<!-- Loading -->
<div id="loading-container">
  <div id="loading">
    <div class="bar"></div>
    <div class="per">Loading...</div>
  </div>
</div>

<!-- Hero -->
<header class="hero-section">
  <div class="hero-content">
    <h1 class="hero-title">&#x1F305; Horizon Daily</h1>
    <p class="hero-tagline">AI-Curated News Digest · Bilingual EN/ZH · Multi-Source</p>
    <div class="hero-links">
      <a href="https://github.com/Thysrael/Horizon" target="_blank" rel="noopener">GitHub</a>
      <a href="configuration">Documentation</a>
    </div>
  </div>
</header>

<!-- Stats -->
<div id="stats-panel" class="stats-panel">
  <div class="stat-item">
    <span class="stat-value" id="stat-posts">—</span>
    <span class="stat-label">Posts</span>
  </div>
  <div class="stat-item">
    <span class="stat-value" id="stat-articles">—</span>
    <span class="stat-label">Articles</span>
  </div>
  <div class="stat-item">
    <span class="stat-value" id="stat-langs">—</span>
    <span class="stat-label">Languages</span>
  </div>
  <div class="stat-item">
    <span class="stat-value" id="stat-updated">—</span>
    <span class="stat-label">Updated</span>
  </div>
</div>

<!-- Filters -->
<div id="filter-bar" class="filter-bar">
  <button class="tag-filter active" data-tag="">All</button>
</div>

<!-- Language toggle -->
<div class="lang-toggle">
  <button id="btn-lang-all" class="active" data-lang="">All</button>
  <button id="btn-lang-en" data-lang="en">EN</button>
  <button id="btn-lang-zh" data-lang="zh">中文</button>
</div>

<!-- Card Wall -->
<div id="wall"></div>

<!-- Footer -->
<footer class="hz-footer">
  <p>Generated by <a href="https://github.com/Thysrael/Horizon" target="_blank" rel="noopener">Horizon</a> — AI-driven information aggregation</p>
</footer>

</body>
</html>
